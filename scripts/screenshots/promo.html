<!doctype html>
<!--
  The Chrome Web Store promo images, captured by capture.mjs:
  promo.html?size=small is the 440x280 tile, and promo.html?size=marquee the
  1400x560 marquee. The store asks for little text, saturated colors, and a
  filled, well-defined image that still reads at half size, so the art is the
  logo and a drawing of the manager rather than a screenshot.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>yt-easy promo</title>
  <style>
    :root {
      --wine-deep: #3d0514;
      --wine: #7d0f2c;
      --coral: #ff4d4f;
      --salmon: #ffa27f;
      --maroon: #a3122f;
      --plum: #6a0a1e;
      --gold: #ffc532;
      --blush: #ffd6d6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    .stage {
      position: relative;
      overflow: hidden;
      /* The glow sits away from the logo, whose red cards need the dark
         wine behind them to stand out. */
      background:
        radial-gradient(circle at 96% 8%, rgb(255 77 79 / 0.5), transparent 52%),
        radial-gradient(circle at 60% 118%, rgb(255 162 127 / 0.32), transparent 55%),
        linear-gradient(135deg, var(--wine-deep) 0%, var(--wine) 100%);
    }

    .small .stage {
      width: 440px;
      height: 280px;
    }

    .marquee .stage {
      width: 1400px;
      height: 560px;
    }

    /* Stacked cards, like the logo's, drifting behind everything. */
    .card {
      position: absolute;
      border-radius: 22%;
      opacity: 0.16;
    }

    .lockup {
      position: absolute;
      display: flex;
      align-items: center;
    }

    .lockup img {
      display: block;
      filter: drop-shadow(0 10px 24px rgb(40 0 10 / 0.45));
    }

    .name {
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-shadow: 0 4px 18px rgb(40 0 10 / 0.35);
    }

    .small .lockup {
      inset: 0;
      justify-content: center;
      gap: 14px;
    }

    .small .lockup img {
      width: 150px;
      height: 150px;
    }

    .small .name {
      font-size: 62px;
    }

    .marquee .lockup {
      top: 118px;
      left: 96px;
      flex-direction: column;
      align-items: flex-start;
      gap: 26px;
    }

    .marquee .lockup img {
      width: 150px;
      height: 150px;
    }

    .marquee .name {
      font-size: 104px;
    }

    .tagline {
      max-width: 470px;
      margin: 0;
      color: var(--blush);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.3;
    }

    .art {
      position: absolute;
      top: 70px;
      right: 70px;
      filter: drop-shadow(0 28px 50px rgb(30 0 8 / 0.55));
    }

    .small .tagline,
    .small .art {
      display: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card" style="width: 300px; height: 220px; left: -90px; bottom: -110px; background: var(--salmon); transform: rotate(-14deg);"></div>
    <div class="card" style="width: 260px; height: 190px; right: -70px; top: -90px; background: var(--coral); transform: rotate(12deg);"></div>

    <div class="lockup">
      <img src="../../icons/logo.png" alt="">
      <span class="name">yt-easy</span>
      <p class="tagline">Group, filter, and clear out your Watch later list in one place.</p>
    </div>

    <!-- The manager, drawn: groups on the left, videos with checkboxes on the right. -->
    <svg class="art" width="700" height="420" viewBox="0 0 700 420" aria-hidden="true">
      <defs>
        <linearGradient id="thumb-a" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff4d4f" />
          <stop offset="1" stop-color="#ffa27f" />
        </linearGradient>
        <linearGradient id="thumb-b" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a3122f" />
          <stop offset="1" stop-color="#ff4d4f" />
        </linearGradient>
        <linearGradient id="thumb-c" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffc532" />
          <stop offset="1" stop-color="#ff8a5c" />
        </linearGradient>
        <symbol id="play" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="12" fill="#6a0a1e" />
          <path d="M9.5 7.5 17 12l-7.5 4.5z" fill="#ffd6d6" />
        </symbol>
        <symbol id="check" viewBox="0 0 24 24">
          <rect width="24" height="24" rx="7" fill="#ffc532" />
          <path d="m6.5 12.5 3.5 3.5 7.5-8" fill="none" stroke="#6a0a1e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="box" viewBox="0 0 24 24">
          <rect x="1.25" y="1.25" width="21.5" height="21.5" rx="6" fill="none" stroke="#ffd6d6" stroke-opacity="0.45" stroke-width="2.5" />
        </symbol>
      </defs>

      <rect width="700" height="420" rx="30" fill="#2b030e" fill-opacity="0.82" />
      <rect x="0.75" y="0.75" width="698.5" height="418.5" rx="29.5" fill="none" stroke="#ffa27f" stroke-opacity="0.22" stroke-width="1.5" />

      <!-- Group rail -->
      <rect x="26" y="30" width="150" height="26" rx="13" fill="#ffd6d6" fill-opacity="0.16" />
      <rect x="26" y="74" width="150" height="26" rx="13" fill="#ffc532" />
      <rect x="26" y="118" width="130" height="26" rx="13" fill="#ffd6d6" fill-opacity="0.16" />
      <rect x="26" y="162" width="140" height="26" rx="13" fill="#ffd6d6" fill-opacity="0.16" />
      <rect x="26" y="206" width="112" height="26" rx="13" fill="#ffd6d6" fill-opacity="0.16" />
      <rect x="26" y="250" width="124" height="26" rx="13" fill="#ffd6d6" fill-opacity="0.16" />
      <rect x="26" y="294" width="100" height="26" rx="13" fill="#ffd6d6" fill-opacity="0.16" />
      <line x1="200" y1="24" x2="200" y2="396" stroke="#ffd6d6" stroke-opacity="0.14" stroke-width="2" />

      <!-- Video rows; the first, second, and fourth are selected. -->
      <rect x="214" y="24" width="462" height="84" rx="16" fill="#ff4d4f" fill-opacity="0.2" />
      <use href="#check" x="228" y="54" width="24" height="24" />
      <rect x="268" y="36" width="104" height="60" rx="12" fill="url(#thumb-a)" />
      <use href="#play" x="306" y="52" width="28" height="28" />
      <rect x="390" y="46" width="230" height="14" rx="7" fill="#ffd6d6" fill-opacity="0.75" />
      <rect x="390" y="72" width="150" height="12" rx="6" fill="#ffd6d6" fill-opacity="0.35" />

      <rect x="214" y="118" width="462" height="84" rx="16" fill="#ff4d4f" fill-opacity="0.2" />
      <use href="#check" x="228" y="148" width="24" height="24" />
      <rect x="268" y="130" width="104" height="60" rx="12" fill="url(#thumb-b)" />
      <use href="#play" x="306" y="146" width="28" height="28" />
      <rect x="390" y="140" width="196" height="14" rx="7" fill="#ffd6d6" fill-opacity="0.75" />
      <rect x="390" y="166" width="120" height="12" rx="6" fill="#ffd6d6" fill-opacity="0.35" />

      <use href="#box" x="228" y="242" width="24" height="24" />
      <rect x="268" y="224" width="104" height="60" rx="12" fill="url(#thumb-c)" />
      <use href="#play" x="306" y="240" width="28" height="28" />
      <rect x="390" y="234" width="250" height="14" rx="7" fill="#ffd6d6" fill-opacity="0.75" />
      <rect x="390" y="260" width="164" height="12" rx="6" fill="#ffd6d6" fill-opacity="0.35" />

      <rect x="214" y="306" width="462" height="84" rx="16" fill="#ff4d4f" fill-opacity="0.2" />
      <use href="#check" x="228" y="336" width="24" height="24" />
      <rect x="268" y="318" width="104" height="60" rx="12" fill="url(#thumb-a)" />
      <use href="#play" x="306" y="334" width="28" height="28" />
      <rect x="390" y="328" width="210" height="14" rx="7" fill="#ffd6d6" fill-opacity="0.75" />
      <rect x="390" y="354" width="136" height="12" rx="6" fill="#ffd6d6" fill-opacity="0.35" />
    </svg>
  </div>
  <script>
    document.body.className = new URLSearchParams(location.search).get('size') === 'marquee' ? 'marquee' : 'small';
  </script>
</body>
</html>
