name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check that the manifest is valid JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
      - name: Check the syntax of the plain scripts
        run: find src/content src/background.js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build
        run: npm run build
      - name: Run unit tests
        run: npm test
